<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sutra</title>
<style>
/* ==========================================================================
   sutra extension — the same design system as the app, not a lookalike.

   This popup used to run on its own palette: a #2923d5 indigo brand, cool
   #17152f ink, and a second stylesheet underneath half-converting it to warm.
   The result read as a different product wearing the same name, and it had no
   dark mode at all, so on a dark desktop it was a white rectangle.

   Every colour below is lifted from web/src/app/globals.css. Amounts are mono
   because they are facts to be checked, not decoration.
   ========================================================================== */

:root {
  --paper: #f7f6f2;
  --surface: #ffffff;
  --surface-2: #efeee9;
  --ink: #121210;
  --ink-2: #5d5b55;
  --ink-3: #89867e;
  --line: #dfddd5;
  --line-2: #cecbc1;
  --brand: #ff5c35;
  --brand-ink: #c63817;
  --brand-soft: #fff0ea;
  --brand-line: #ffc4b5;
  --ok: #12734f;
  --ok-soft: #e3f3ea;
  --ok-line: #a9d8c1;
  --warn: #96580a;
  --warn-soft: #fbf1e1;
  --bad: #a4231f;
  --bad-soft: #fbeae8;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  --shadow: 0 2px 4px rgb(25 24 23 / .05), 0 8px 24px rgb(25 24 23 / .06);
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121110;
    --surface: #1a1918;
    --surface-2: #211f1d;
    --ink: #f3f0ea;
    --ink-2: #a9a29a;
    --ink-3: #7d766e;
    --line: #2e2b28;
    --line-2: #3b3733;
    --brand: #ff7a57;
    --brand-ink: #ff9878;
    --brand-soft: #2d1b14;
    --brand-line: #5c3324;
    --ok: #4cc78f;
    --ok-soft: #14261e;
    --ok-line: #27503d;
    --warn: #dda94f;
    --warn-soft: #2a2114;
    --bad: #e8776f;
    --bad-soft: #2c1715;
    --shadow: 0 2px 4px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .35);
  }
}

* { box-sizing: border-box }
body {
  margin: 0; width: 394px; min-height: 540px;
  background: var(--paper); color: var(--ink);
  font: 13.5px/1.5 "Manrope", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: -.006em;
}
button, input, select { font: inherit; color: inherit }

/* -- header ------------------------------------------------------------- */
.top { padding: 15px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); background: var(--surface) }
.mark { width: 30px; height: 30px; position: relative; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); flex: none }
.mark:before { content: ""; position: absolute; border-radius: 50%; width: 6px; height: 6px; left: 6px; top: 11px; background: var(--brand); box-shadow: 9px 0 0 var(--ink), 4.5px 0 0 var(--brand) }
.brand { font-size: 16px; font-weight: 750; letter-spacing: -.045em; line-height: 1.1 }
.sub { font-size: 10.5px; color: var(--ink-3) }
.account { margin-left: auto; text-align: right; min-width: 0 }
.account b { font-size: 12px; font-weight: 600 }

/* -- shell -------------------------------------------------------------- */
.main { padding: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 13px; box-shadow: var(--shadow) }

/* -- what was read off the page ----------------------------------------- */
.product { display: grid; grid-template-columns: 54px 1fr; gap: 12px; align-items: start }
.product img { width: 54px; height: 54px; border-radius: var(--r); object-fit: cover; background: var(--surface-2) }
.kicker { font-size: 9.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); font-weight: 700 }
.title { font-weight: 650; letter-spacing: -.02em; margin-top: 3px; line-height: 1.3 }
.meta { font-size: 11.5px; color: var(--ink-2); margin-top: 4px; font-family: var(--mono) }

/* How much of this we actually believe. Green only when it is genuinely
   structured data; amber and red are not decoration, they are a warning that
   the number below may need checking before anyone is asked to confirm it. */
.confidence { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; padding: 3px 8px; border-radius: 999px; font-size: 10px; font-weight: 650; background: var(--surface-2); color: var(--ink-2) }
.confidence:before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor }
.confidence.is-high { background: var(--ok-soft); color: var(--ok); box-shadow: inset 0 0 0 1px var(--ok-line) }
.confidence.is-low { background: var(--warn-soft); color: var(--warn) }
.confidence.is-guess { background: var(--bad-soft); color: var(--bad) }

/* -- sections ----------------------------------------------------------- */
.section { margin-top: 15px }
.label { display: flex; justify-content: space-between; align-items: baseline; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; color: var(--ink-3) }
.cart-lines { overflow: hidden; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
.cart-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 9px 11px; font-size: 11.5px; line-height: 1.35 }
.cart-line + .cart-line { border-top: 1px solid var(--line) }
.cart-line b { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap }
.cart-line span { color: var(--ink-2); font-family: var(--mono); font-size: 10.5px }

.people { display: flex; flex-wrap: wrap; gap: 6px }
.person { border: 1px solid var(--line-2); background: var(--surface); padding: 6px 11px; border-radius: 999px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; transition: .14s }
.person:hover { border-color: var(--brand-line); color: var(--ink) }
.person.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-ink); font-weight: 600 }

.circle { width: 100%; border: 1px solid var(--line-2); background: var(--surface); padding: 9px 11px; border-radius: var(--r); text-align: left; cursor: pointer; margin-bottom: 6px; transition: .14s }
.circle:hover { border-color: var(--brand-line) }
.circle.on { border-color: var(--brand); background: var(--brand-soft) }
.circle b { font-size: 12.5px; font-weight: 600 }

.grid { display: grid; grid-template-columns: 1fr 88px; gap: 8px }
input, select { width: 100%; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); padding: 9px 11px; outline: none; transition: .14s }
input:focus, select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft) }
#price, #qty { font-family: var(--mono) }

/* -- the number ---------------------------------------------------------- */
.sum { margin-top: 15px; padding: 13px 14px; border-radius: var(--r-lg); background: var(--surface-2); border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end }
.sum span { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 700 }
.sum b, .sum #total { font-family: var(--mono); font-size: 15px; font-weight: 600; display: block; margin-top: 3px }
.sum b { font-size: 19px; color: var(--brand-ink) }

.cta { width: 100%; border: 0; border-radius: var(--r); padding: 12px 16px; margin-top: 10px; background: var(--brand); color: #fff; font-weight: 650; font-size: 13.5px; cursor: pointer; transition: .14s }
.cta:hover:not(:disabled) { filter: brightness(1.06) }
.cta:disabled { opacity: .55; cursor: default }
.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2) }
.secondary:hover:not(:disabled) { border-color: var(--brand); filter: none }

.note, .error { font-size: 11px; line-height: 1.5; margin-top: 10px; color: var(--ink-3) }
.error { color: var(--bad); background: var(--bad-soft); padding: 8px 10px; border-radius: var(--r-sm) }

/* -- the not-connected state -------------------------------------------- */
.connect { text-align: center; padding: 24px 14px }
.connect .mark { margin: 0 auto 12px }
.connect h2 { font-size: 21px; letter-spacing: -.04em; font-weight: 650; margin: 0 0 6px }
.connect p { margin: 0 }
.token { margin-top: 12px; text-align: center; font-family: var(--mono); font-size: 12px }

.links { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 12px }
.link { border: 0; background: none; color: var(--brand-ink); font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline }
.loading { padding: 60px 14px; text-align: center; color: var(--ink-3); font-size: 12.5px }

@media (prefers-reduced-motion: no-preference) {
  .card { animation: up .3s ease both }
  @keyframes up { from { opacity: 0; transform: translateY(6px) } }
}
</style>
</head>
<body>
  <header class="top">
    <div class="mark" aria-hidden="true"></div>
    <div>
      <div class="brand">sutra</div>
      <div class="sub">bring this page to your people</div>
    </div>
    <div class="account" id="account"></div>
  </header>
  <main class="main" id="main">
    <div class="loading">Reading this page…</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
