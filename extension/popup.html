<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sutra</title>
<style>
  :root { color-scheme: light }
  * { box-sizing: border-box }
  body {
    width: 386px; margin: 0; background: #fbfaf8; color: #14100a;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  .hd { display:flex; align-items:center; gap:9px; padding:13px 15px 11px; border-bottom:1px solid #ece8e1; position:sticky; top:0; background:#fbfaf8; z-index:2 }
  .hd b { flex:1; font-size:14px; font-weight:750; letter-spacing:-.01em }
  .spark { width:21px;height:21px;border-radius:7px;background:#f59e0b;display:grid;place-items:center;font-size:11px }
  .ghost { border:1px solid #ddd7cd; background:#fff; border-radius:8px; font-size:11px; font-weight:650; padding:5px 8px; cursor:pointer; color:#57534e }
  .ghost:hover { border-color:#f59e0b; color:#92400e }
  .bd { padding: 14px 15px 17px }
  .card { display:flex; gap:11px; background:#fff; border:1px solid #ece8e1; border-radius:12px; padding:11px }
  .card img { width:52px;height:52px;object-fit:cover;border-radius:8px;background:#f0ece5;flex:none }
  .t { flex:1; min-width:0 }
  .ttl { font-weight:700; font-size:13.5px; line-height:1.35 }
  .mut { color:#78716c; font-size:11.5px }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px }
  .chip { font-size:10px; letter-spacing:.04em; text-transform:uppercase; padding:3px 6px; border-radius:5px; background:#f0ece5; color:#57534e; font-weight:650 }
  .chip.hi{background:#dcfce7;color:#166534}.chip.md{background:#fef3c7;color:#92400e}.chip.lo{background:#fee2e2;color:#991b1b}
  .warn { margin-top:9px; font-size:11.5px; line-height:1.5; color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-left:3px solid #f59e0b; border-radius:8px; padding:8px 10px }
  .warn div+div { margin-top:4px }
  label { display:block; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#a8a29e; margin:14px 0 5px }
  input, select { width:100%; padding:9px 10px; border:1px solid #ddd7cd; border-radius:8px; font-size:13.5px; background:#fff; color:#14100a; font-family:inherit }
  input:focus, select:focus { outline:2px solid #f59e0b; outline-offset:-1px }
  .row { display:flex; gap:8px } .row > * { flex:1 }
  .qty { max-width:76px } .cur { max-width:72px }
  .people { display:flex; flex-direction:column; gap:6px }
  .person { display:flex; gap:6px }
  .person button { flex:none; width:30px; border:0; background:#f0ece5; border-radius:8px; cursor:pointer; color:#57534e }
  .add { margin-top:6px; border:1px dashed #ddd7cd; background:transparent; color:#78716c; padding:8px; border-radius:8px; width:100%; cursor:pointer; font-size:12.5px }
  .add:hover { border-color:#f59e0b; color:#92400e }
  .sum { margin-top:14px; background:#14100a; color:#fbfaf8; border-radius:12px; padding:12px 14px }
  .sum .l { display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; color:#a8a29e }
  .sum .l b { color:#fbfaf8; font-size:18px; font-weight:750 }
  .sum .l + .l { margin-top:5px }
  .cta { margin-top:12px; width:100%; padding:13px; border:0; border-radius:11px; background:#f59e0b; color:#14100a; font-size:14px; font-weight:750; cursor:pointer; display:block; text-align:center; text-decoration:none; font-family:inherit }
  .cta:hover { background:#fbbf24 } .cta:disabled { opacity:.55; cursor:progress }
  .cta.alt { background:#f0ece5; color:#57534e; margin-top:8px; font-size:13px; padding:11px }
  .err { margin-top:11px; font-size:12.5px; color:#991b1b; background:#fee2e2; border-radius:8px; padding:9px 11px; line-height:1.5 }
  .mem { display:flex; gap:11px; align-items:center; background:#fff; border:1px solid #ece8e1; border-radius:12px; padding:10px; margin-top:8px }
  .mem img { width:76px; height:76px; flex:none; border-radius:8px; background:#f7f5f1 }
  .n { font-weight:700; font-size:13px } .a { font-size:17px; font-weight:750; margin:1px 0 6px }
  .lnk { display:inline-block; font-size:11.5px; font-weight:650; color:#92400e; background:#fef3c7; border:0; border-radius:6px; padding:5px 8px; cursor:pointer; text-decoration:none; margin-right:4px; font-family:inherit }
  .lnk:hover { background:#fde68a }
  .foot { margin-top:12px; font-size:11px; color:#a8a29e; line-height:1.55; border-top:1px solid #ece8e1; padding-top:10px }
  details { margin-top:12px } summary { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#a8a29e; cursor:pointer }
  .skel { height:10px; border-radius:5px; background:linear-gradient(90deg,#ece8e1,#f7f5f1,#ece8e1); background-size:200% 100%; animation:sh 1.1s linear infinite }
  @keyframes sh { to { background-position:-200% 0 } }
</style>
</head>
<body>
  <div class="hd">
    <div class="spark">⚡</div>
    <b>Split this page</b>
    <button class="ghost" id="onpage" title="Draw the sheet on the page instead">on page</button>
    <button class="ghost" id="settings-toggle">settings</button>
  </div>
  <div class="bd" id="bd">
    <div class="card"><div class="t">
      <div class="skel" style="width:70%"></div>
      <div class="skel" style="width:45%;margin-top:8px"></div>
    </div></div>
    <div class="mut" style="margin-top:11px">Reading this page…</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
