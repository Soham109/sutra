<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sutra — film</title>
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="film.css">
<style>
  /* Preview-only chrome. None of this is part of what gets screenshotted —
     film.css's #film-stage is the only thing render.mjs ever sees, and it
     is always exactly 1920x1080 regardless of this wrapper. */
  html, body {
    width: auto; height: auto; min-height: 100vh; overflow: auto;
    background: #0b0b0a;
    display: flex; flex-direction: column; align-items: center;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #film-viewport {
    width: 1920px; height: 1080px;
    transform-origin: top center;
    flex: none;
  }
  #film-controls {
    position: sticky; bottom: 0;
    display: flex; align-items: center; gap: 14px;
    width: 100%; max-width: 1920px;
    padding: 12px 22px;
    background: #17161488;
    backdrop-filter: blur(8px);
    color: #f2f0ea;
    font-size: 13px;
    box-sizing: border-box;
  }
  #film-controls button {
    font: inherit; color: inherit; cursor: pointer;
    background: #2a2825; border: 1px solid #3a3733; border-radius: 8px;
    padding: 7px 14px;
  }
  #film-controls button:hover { background: #34322e; }
  #film-scrub { flex: 1; accent-color: #ff5c35; }
  #film-time { font-variant-numeric: tabular-nums; min-width: 84px; }
  #film-controls a { color: #ffa98f; }
</style>
</head>
<body>
  <div id="film-viewport">
    <div id="film-stage"></div>
  </div>

  <div id="film-controls">
    <button id="film-play" type="button">Play</button>
    <input id="film-scrub" type="range" min="0" max="1000" value="0" step="1">
    <span id="film-time" class="mono">0.0s / 0.0s</span>
    <span>reduced motion: <span id="film-rm">off</span></span>
  </div>

  <!-- Shared spine. Registers window.FILM. -->
  <script src="engine.js"></script>

  <!-- Scenes 1-3 (THE PROBLEM / THE TURN / THE SAME TRIP, DONE PROPERLY). -->
  <script src="scenes/s1-problem.js"></script>
  <script src="scenes/s2-turn.js"></script>
  <script src="scenes/s3-solution.js"></script>

  <!-- Scenes 4-9 register themselves the same way (FILM.register +
       FILM.caption at load time) — script order does not matter, the engine
       sorts by startMs. Add each new one's <script src="scenes/sN-....js">
       tag here as it's built. -->
  <script src="scenes/s4-surfaces.js"></script>
  <script src="scenes/s5-planning.js"></script>
  <script src="scenes/s6-thread.js"></script>
  <script src="scenes/s7-nanda.js"></script>
  <script src="scenes/s8-limits.js"></script>
  <script src="scenes/s9-close.js"></script>

  <script>
    (function () {
      var viewport = document.getElementById('film-viewport');
      var playBtn = document.getElementById('film-play');
      var scrub = document.getElementById('film-scrub');
      var timeLabel = document.getElementById('film-time');
      var rmLabel = document.getElementById('film-rm');

      function fitViewport() {
        var scale = Math.min(1, (window.innerWidth - 8) / 1920);
        viewport.style.transform = 'scale(' + scale + ')';
        viewport.style.marginBottom = (1080 * scale - 1080) + 'px';
      }
      window.addEventListener('resize', fitViewport);
      fitViewport();

      var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      rmLabel.textContent = reducedMotion ? 'on (cuts between beats)' : 'off';

      var playing = false;
      var raf = null;
      var startedAt = 0;
      var startT = 0;
      var lastCutT = 0;

      function duration() { return window.FILM.durationMs || 1; }

      function paint(t) {
        window.FILM.seek(t);
        scrub.value = String(Math.round((t / duration()) * 1000));
        timeLabel.textContent = (t / 1000).toFixed(1) + 's / ' + (duration() / 1000).toFixed(1) + 's';
      }

      function tick() {
        var elapsed = performance.now() - startedAt;
        var t = startT + elapsed;
        if (t >= duration()) {
          paint(duration());
          playing = false;
          playBtn.textContent = 'Play';
          return;
        }
        if (reducedMotion) {
          // "gets a version with no movement, just cuts": advance in fixed
          // jumps instead of every frame, so the live preview cuts between
          // held states rather than smoothly interpolating them.
          if (t - lastCutT >= 450) {
            lastCutT = t;
            paint(t);
          }
        } else {
          paint(t);
        }
        raf = requestAnimationFrame(tick);
      }

      function play() {
        if (playing) return;
        playing = true;
        playBtn.textContent = 'Pause';
        startedAt = performance.now();
        startT = window.FILM.currentMs || 0;
        if (startT >= duration()) startT = 0;
        lastCutT = startT;
        raf = requestAnimationFrame(tick);
      }

      function pause() {
        playing = false;
        playBtn.textContent = 'Play';
        if (raf) cancelAnimationFrame(raf);
      }

      playBtn.addEventListener('click', function () {
        if (playing) pause(); else play();
      });

      scrub.addEventListener('input', function () {
        pause();
        var t = (Number(scrub.value) / 1000) * duration();
        paint(t);
      });

      document.addEventListener('keydown', function (e) {
        if (e.code === 'Space') { e.preventDefault(); if (playing) pause(); else play(); }
        if (e.code === 'ArrowRight') { pause(); paint(Math.min(duration(), (window.FILM.currentMs || 0) + 1000)); }
        if (e.code === 'ArrowLeft') { pause(); paint(Math.max(0, (window.FILM.currentMs || 0) - 1000)); }
      });

      paint(0);
    })();
  </script>
</body>
</html>
